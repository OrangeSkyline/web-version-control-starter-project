<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Goofy Ahh Webpage</title>
    <link href="" ref="stylesheet" />
    <link

    />
    <link href="moving-text.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <style>
    #head1 {
      color: white;
      text-align: center;
      font-style: italic;

    <div class="container">
      <div class="row">
        <div class="col-md-6 p-4" id="col1">Previous Work</div>
